# Private, hardware-free audio graph for the Electron regression.
context.properties = {
    core.daemon = true
    core.name = pipewire-0
    support.dbus = false
    default.clock.rate = 48000
    default.clock.quantum = 480
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-access }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-protocol-pulse }
]
context.objects = [
    { factory = metadata args = {
        metadata.name = default
        metadata.values = [
            { key = default.audio.sink value = { name = fixture_sink } }
        ]
    } }
    { factory = spa-node-factory args = {
        factory.name = support.node.driver
        node.name = Dummy-Driver
        node.group = pipewire.dummy
        priority.driver = 20000
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = fixture_sink
        node.description = "Isolated Sharkord regression sink"
        media.class = Audio/Sink
        audio.position = [ FL FR ]
        node.driver = true
        adapter.auto-port-config = { mode = dsp monitor = false position = preserve }
    } }
]
pulse.properties = {
    server.address = [ "unix:native" ]
    server.dbus-name = ""
}
stream.properties = {
    node.autoconnect = false
    adapter.auto-port-config = { mode = dsp monitor = false position = preserve }
}
