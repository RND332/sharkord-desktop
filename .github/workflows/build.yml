name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx vitest run

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: bun run dist:linux
          - os: windows-latest
            command: bun run dist:win
          - os: macos-latest
            command: bun run dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Package
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check Windows audio verification tools
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/windows-audio-smoke.ps1 -CheckOnly
      - name: Upload Windows audio verification kit
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-audio-verification
          path: |
            native/out/win-audio-capture.exe
            scripts/windows-audio-smoke.ps1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          # Installers only: release/* would also drag the unpacked app directories along.
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.pacman
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Show what will be published
        run: ls -lh artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
